name: Sync Leetcode

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install curl_cffi (Bypasses Cloudflare 403)
        run: pip install curl_cffi

      - name: Fetch Accepted Submissions
        run: |
          cat << 'EOF' > sync.py
          import os
          from datetime import datetime, timezone
          from curl_cffi import requests

          USERNAME = "rohit_marthanda_naik"
          URL = "https://leetcode.com/graphql"

          query = """
          query recentAcSubmissions($username: String!,$limit: Int!) {
            recentAcSubmissionList(username: $username, limit:$limit) {
              id
              title
              titleSlug
              timestamp
              lang
            }
          }
          """

          session = requests.Session(impersonate="chrome")
          response = session.post(
              URL,
              json={
                  "query": query,
                  "variables": {"username": USERNAME, "limit": 20}
              },
              headers={
                  "Content-Type": "application/json",
                  "Referer": "https://leetcode.com",
                  "Origin": "https://leetcode.com"
              },
              timeout=30
          )

          print("HTTP Status:", response.status_code)
          if response.status_code != 200:
              print("Response text:", response.text[:500])
              raise SystemExit("Blocked by Cloudflare or LeetCode.")

          data = response.json()
          submissions = (data.get("data") or {}).get("recentAcSubmissionList") or []
          print(f"Fetched {len(submissions)} recent accepted submissions.")

          os.makedirs("leetcode-solutions", exist_ok=True)

          for sub in submissions:
              slug = sub["titleSlug"]
              title = sub["title"]
              lang = sub.get("lang", "unknown")
              ts = int(sub["timestamp"])
              dt = datetime.fromtimestamp(ts, tz=timezone.utc).strftime("%Y-%m-%d %H:%M:%S UTC")

              folder = os.path.join("leetcode-solutions", slug)
              os.makedirs(folder, exist_ok=True)
              readme_path = os.path.join(folder, "README.md")

              content = (
                  f"# {title}\n\n"
                  f"- **Problem Link:** [https://leetcode.com/problems/{slug}/](https://leetcode.com/problems/{slug}/)\n"
                  f"- **Language:** `{lang}`\n"
                  f"- **Last Accepted Submission ID:** `{sub['id']}`\n"
                  f"- **Solved At:** {dt}\n"
              )

              with open(readme_path, "w", encoding="utf-8") as f:
                  f.write(content)
          EOF
          python sync.py
          rm sync.py

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add leetcode-solutions/
          if git diff --staged --quiet; then
            echo "No new changes to commit."
          else
            git commit -m "[LeetCode Sync] Update accepted submissions"
            git push
          fi`````````````````````````````````````````````````````````````````````````````````
